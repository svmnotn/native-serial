
[package]
authors     = ["Victor M. Suarez <root@svmnotn.dev>"]
description = "Native serial port bindings for Node.js using napi-rs"
edition     = "2021"
homepage    = "https://github.com/svmnotn/native-serial#readme"
license     = "MIT"
name        = "native_serial"
repository  = "https://github.com/svmnotn/native-serial"
version     = "1.3.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
crossbeam   = "0.8.4"
napi        = "3.5.2"
napi-derive = "3.3.3"
serialport  = "4.8.1"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto   = true
strip = "symbols"
